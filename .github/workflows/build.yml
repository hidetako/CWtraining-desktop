# Windows 用のインストーラーを組み立てる。
#
# 版の出し方は 3 つ。どれも、その時点の Web 版（CWtraining の main）を取り込んで組み立てる
# - main に push する: package.json の version のタグ（v1.2.3）がまだ無ければ、
#   タグを打って GitHub Release に exe を添付する。既にあれば Artifacts に置くだけ
#   （version を上げて push すれば、それが新しい版になる）
# - タグ v1.2.3 を push する: そのタグで Release を作る
# - 「Run workflow」（手動）: 取り込む Web 版の枝・タグを選べる。「Release を作る」に
#   チェックを入れると package.json の version でタグを打って Release に添付する
name: build

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      app_ref:
        description: '取り込む Web 版（CWtraining）の枝・タグ・commit'
        default: 'main'
        required: true
      release:
        description: 'Release を作る（package.json の version でタグを打ち、exe を添付）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 版の番号と、Release を作るかどうか
        id: ver
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          WANT_RELEASE: ${{ github.event.inputs.release }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          release=false
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"; release=true
          elif [[ "$EVENT" == workflow_dispatch && "$WANT_RELEASE" == true ]]; then
            release=true
          elif [[ "$EVENT" == push && "$REF" == refs/heads/main ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "タグ $tag は既にあるので Release は作らない（Artifacts のみ）"
            else
              release=true
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag release=$release"

      - name: Web 版を取り込む
        env:
          APP_REF: ${{ github.event.inputs.app_ref || 'main' }}
        run: node scripts/fetch-app.mjs

      - name: 起動して確かめる（画面・ドリル・設定の保存・リンク）
        env:
          SHOTS: shots
        run: |
          mkdir shots
          npm run check

      - name: インストーラーを組み立てる
        run: npm run dist

      - name: 組み立てた物の一覧
        shell: bash
        run: ls -la dist/*.exe && cat app/VERSION.json

      - uses: actions/upload-artifact@v4
        with:
          name: CWtraining-windows-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            app/VERSION.json
            shots/*.png
          retention-days: 14

      - name: Release に添付する
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CW 交信トレーニング ${{ steps.ver.outputs.tag }}
          files: dist/*.exe
          generate_release_notes: true
          body_path: app/VERSION.json
